# EPG (XMLTV) sources.
#
# Each entry is a URL to an XMLTV document (plain or gzipped). Guides are
# downloaded, normalised to UTC, matched to Nexus channel ids and merged into
# a single guide plus per-country shards.
#
# `countries` narrows fuzzy channel matching, which is the single most
# effective way to avoid wrong links — always fill it in when you can.
# `trust` breaks ties when two guides describe the same programme slot.
#
# The entries below are disabled by default so a fresh clone does not hammer
# third-party servers. Enable the ones you actually want, and check each
# source's terms before redistributing its data.

sources:
  - id: iptv-org-epg
    name: iptv-org EPG (generate with the iptv-org/epg grabber)
    # Point this at your own generated guide, e.g. a GitHub Pages artifact.
    url: https://example.com/guide.xml.gz
    enabled: false
    lang: en
    countries: []
    trust: 0.8

  # - id: epg-uk
